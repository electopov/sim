<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 6 Math Center</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--text:#1c1e21;--muted:#65676b;--in:#fff;--bdr:#dddfe2;--blue:#1877f2;--bbg:rgba(24,119,242,.12);--tog:#e4e6eb}
body.dark{--bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--in:#3a3b3c;--bdr:#4e4f50;--blue:#2d88ff;--bbg:rgba(45,136,255,.16);--tog:#3a3b3c}
body.girl{--bg:#fdf2f8;--card:#fff;--text:#3b0d26;--muted:#83385d;--in:#fff5f9;--bdr:#f9a8d4;--blue:#ec4899;--bbg:rgba(236,72,153,.14);--tog:#fce7f3}
body.dark.girl{--bg:#1f1219;--card:#2d1a24;--text:#fce7f3;--muted:#f472b6;--in:#3d2230;--bdr:#70244b;--blue:#f472b6;--bbg:rgba(244,114,182,.18);--tog:#3d2230}
*{box-sizing:border-box;margin:0;padding:0;font-family:Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;cursor:pointer;overflow-x:hidden;transition:.3s}
body.started{cursor:default}
.tog{position:fixed;top:18px;right:20px;z-index:10;background:var(--tog);color:var(--text);border:1px solid var(--bdr);border-radius:20px;padding:8px 14px;font-weight:600;cursor:pointer}
.stage{position:relative;width:100%;max-width:980px;min-height:500px;padding:20px;display:flex;justify-content:center;align-items:center}
.brand{width:100%;max-width:480px;text-align:center;transition:opacity .6s,transform .8s cubic-bezier(.22,1,.36,1)}
body.s-pick .brand,body.s-center .brand{opacity:0;transform:scale(.95);pointer-events:none}
body.s-split .brand{opacity:1;text-align:left;transform:translateX(-250px)}
.badge{display:inline-block;background:var(--bbg);color:var(--blue);font-weight:700;font-size:.9rem;padding:5px 12px;border-radius:20px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
body.s-split .row{justify-content:flex-start}
.row img{width:58px;height:58px;object-fit:contain;border-radius:10px}
.title{color:var(--blue);font-size:3.6rem;font-weight:700;letter-spacing:-1.5px;line-height:1}
.tag{font-size:1.5rem;line-height:1.35}
.hint{margin-top:24px;color:var(--muted)}
body.started .hint{display:none}
.box{position:absolute;width:100%;max-width:396px;opacity:0;pointer-events:none;transform:translateY(15px) scale(.95);transition:opacity .6s,transform .8s cubic-bezier(.22,1,.36,1)}
body.s-pick .picker,body.s-center .login{opacity:1;pointer-events:auto;transform:translate(0,0) scale(1)}
body.s-split .login{opacity:1;pointer-events:auto;transform:translate(270px,0) scale(1)}
.card{background:var(--card);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:20px;text-align:center}
.greet{font-size:1.15rem;font-weight:700;margin-bottom:12px}
.prow{display:flex;gap:12px;margin-top:14px}
.pbtn{flex:1;padding:18px 12px;border-radius:10px;border:2px solid;font-size:1.1rem;font-weight:700;cursor:pointer}
.pboy{background:rgba(24,119,242,.12);color:#1877f2;border-color:#1877f2}
.pgirl{background:rgba(236,72,153,.14);color:#ec4899;border-color:#ec4899}
input,select{width:100%;padding:14px;margin-bottom:12px;background:var(--in);border:1px solid var(--bdr);border-radius:6px;font-size:1rem;color:var(--text)}
.btn{width:100%;background:var(--blue);border:none;border-radius:6px;color:#fff;font-size:1.2rem;font-weight:700;padding:12px;cursor:pointer}
.msg{margin-top:12px;font-size:.9rem;font-weight:600;min-height:18px}
.err{color:#e41e3f}.ok{color:#42b72a}
.div{border-bottom:1px solid var(--bdr);margin:16px 0}
.req{font-size:.95rem;color:var(--muted)}.req a{color:var(--blue);font-weight:700;cursor:pointer}
.note{text-align:center;margin-top:18px;font-size:.88rem;color:var(--muted)}.note a{color:var(--text);font-weight:700;text-decoration:none}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;justify-content:center;align-items:center;z-index:50;padding:20px}
.mbg.open{display:flex}
.modal{background:var(--card);border-radius:8px;padding:20px;width:100%;max-width:380px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mclose{background:none;border:none;font-size:1.4rem;color:var(--muted);cursor:pointer}
.btng{width:100%;background:#42b72a;border:none;border-radius:6px;color:#fff;font-size:1.05rem;font-weight:700;padding:12px;cursor:pointer}
@media(max-width:920px){.stage{flex-direction:column;gap:24px}body.s-split .brand{text-align:center;transform:none}body.s-split .row{justify-content:center}body.s-split .login{position:static;transform:none}}
</style>
</head>

const snd=document.getElementById('snd'),logo=document.getElementById('siteLogo'),tog=document.getElementById('tog');
snd.src=B64_SND;
function setG(m){const g=m==='girl';document.body.classList.toggle('girl',g);logo.src=g?B64_GIRL:B64_BOY;localStorage.setItem('math6_gender',m)}
setG(localStorage.getItem('math6_gender')||'boy');
if(localStorage.getItem('math6_theme')==='dark'){document.body.classList.add('dark');tog.textContent='☀️ Light Mode'}
tog.onclick=(e)=>{e.stopPropagation();const d=document.body.classList.toggle('dark');localStorage.setItem('math6_theme',d?'dark':'light');tog.textContent=d?'☀️ Light Mode':'🌙 Dark Mode'};
let started=false;
document.body.onclick=()=>{if(started)return;started=true;snd.play().catch(()=>{});document.body.classList.add('started','s-pick')};
function pick(m,e){e.stopPropagation();setG(m);document.body.classList.replace('s-pick','s-center');setTimeout(()=>{document.body.classList.replace('s-center','s-split');document.getElementById('usr').focus()},850)}
document.getElementById('pBoy').onclick=(e)=>pick('boy',e);
document.getElementById('pGirl').onclick=(e)=>pick('girl',e);
document.getElementById('loginForm').onsubmit = (e) => {
  e.preventDefault();
  const id = document.getElementById('usr').value.trim().toLowerCase();
  const pass = document.getElementById('pwd').value.trim();
  const msg = document.getElementById('msg');
  const found = JSON.parse(localStorage.getItem('math6_students') || '[]')
    .find(s => s.id.toLowerCase() === id && s.pass === pass);

  if (found) {
    localStorage.setItem('math6_active', JSON.stringify(found));
    msg.className = 'msg ok';
    msg.textContent = `Welcome, ${found.name} (${found.section})!`;
    // Redirects to home.html after 0.8 seconds
    setTimeout(() => { window.location.href = 'home.html'; }, 800);
  } else {
    msg.className = 'msg err';
    msg.textContent = 'Invalid Student ID or Class Password.';
  }
};

const modal=document.getElementById('reqModal');
document.getElementById('openReq').onclick=(e)=>{e.preventDefault();e.stopPropagation();modal.classList.add('open')};
document.getElementById('closeReq').onclick=(e)=>{e.stopPropagation();modal.classList.remove('open')};
document.getElementById('reqForm').onsubmit=(e)=>{e.preventDefault();const name=document.getElementById('rName').value.trim(),section=document.getElementById('rSec').value;const reqs=JSON.parse(localStorage.getItem('math6_requests')||'[]');reqs.push({name,section});localStorage.setItem('math6_requests',JSON.stringify(reqs));e.target.reset();modal.classList.remove('open');const msg=document.getElementById('msg');msg.className='msg ok';msg.textContent=`Request saved for ${name} (${section})!`};
</script>
</body>
